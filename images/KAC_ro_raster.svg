, sans-serif" font-size="17" font-weight="bold" fill="#16150f">Local</text><text x="630.0" y="177.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">1</text><line x1="690" y1="200" x2="690" y2="490" stroke="#d0cec4" stroke-width="1.5"/><text x="750.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">USB</text><text x="750.0" y="177.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">1</text><line x1="810" y1="200" x2="810" y2="490" stroke="#d0cec4" stroke-width="1.5"/><text x="870.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">Dante</text><text x="870.0" y="177.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">1</text><text x="316" y="236.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Kanal 1 · Kick</text><line x1="330" y1="258" x2="930" y2="258" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="294.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Kanal 2 · Snare</text><line x1="330" y1="316" x2="930" y2="316" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="352.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Kanal 3 · Pastor</text><line x1="330" y1="374" x2="930" y2="374" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="410.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Kanal 4 · Playback</text><line x1="330" y1="432" x2="930" y2="432" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="468.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Kanal 5 · Kick (Stream)</text><circle cx="390.0" cy="229.0" r="13" fill="#16150f" stroke="#16150f" stroke-width="2"/><circle cx="510.0" cy="287.0" r="13" fill="#16150f" stroke="#16150f" stroke-width="2"/><circle cx="630.0" cy="345.0" r="13" fill="#16150f" stroke="#16150f" stroke-width="2"/><circle cx="750.0" cy="403.0" r="13" fill="#16150f" stroke="#16150f" stroke-width="2"/><circle cx="390.0" cy="461.0" r="13" fill="#e02718" stroke="#e02718" stroke-width="2"/><text x="1000" y="175.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Punkt = verbunden</text><text x="1000" y="203.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">Quelle der Spalte geht auf das Ziel der Zeile.</text><text x="1000" y="263.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Pro Ziel nur EIN Punkt</text><text x="1000" y="291.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">Ein Kanal kann nur eine Quelle haben.</text><text x="1000" y="351.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#e02718">Eine Quelle — mehrere Ziele</text><text x="1000" y="379.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">Stagebox 1 geht auf Kanal 1 UND Kanal 5</text><text x="1000" y="400.2" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">(z. B. eigener Kick-Kanal für den Stream).</text><text x="1000" y="461.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Leere Spalte</text><text x="1000" y="489.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">Dante 1 ist nirgends verbunden — kommt nicht an.</text><text x="750" y="600.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6a62">Welche Achse Quelle und welche Ziel ist, unterscheidet sich je nach Gerät — immer zuerst die Beschriftung lesen.</text></svg>
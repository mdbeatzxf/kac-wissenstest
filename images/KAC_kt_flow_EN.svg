<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800"><defs><marker id="ah" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6a62"/></marker><marker id="ahr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e02718"/></marker></defs><rect x="0" y="0" width="1500" height="800" fill="#f2f1ec"/><rect x="600" y="30" width="300" height="70" rx="12" ry="12" fill="#e02718" stroke="#e02718" stroke-width="2"/><text x="750.0" y="74.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#faf9f5">No sound!</text><line x1="750" y1="102" x2="750" y2="146" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><polygon points="750,150.0 1010.0,230 750,310.0 490.0,230" fill="#faf9f5" stroke="#16150f" stroke-width="2.5"/><text x="750" y="223.7" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16150f">Does the CHANNEL meter</text><text x="750" y="252.4" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16150f">show a signal?</text><path d="M 490 230 L 270 230 L 270 386" fill="none" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><text x="380" y="218.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e02718">NO</text><rect x="40" y="390" width="460" height="250" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="270.0" y="461.1" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16150f">Input side</text><text x="270.0" y="508.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Source on? Volume on the instrument?</text><text x="270.0" y="532.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Wireless: battery, mute switch, receiver</text><text x="270.0" y="556.3" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Cable correct &amp; locked in?</text><text x="270.0" y="580.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Right input per patch list?</text><text x="270.0" y="603.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Input patch in the desk · 48 V · gain</text><line x1="750" y1="312" x2="750" y2="386" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><text x="782" y="356.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2e8b57">YES</text><polygon points="750,390.0 1010.0,470 750,550.0 490.0,470" fill="#faf9f5" stroke="#16150f" stroke-width="2.5"/><text x="750" y="463.7" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16150f">Does the MASTER meter</text><text x="750" y="492.4" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16150f">show a signal?</text><path d="M 750 552 L 750 600" fill="none" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><text x="782" y="585.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e02718">NO</text><rect x="560" y="604" width="380" height="170" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="750.0" y="658.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16150f">Inside the desk</text><text x="750.0" y="706.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Channel mute · fader · DCA</text><text x="750.0" y="730.3" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">mute group · routing to main</text><text x="750.0" y="754.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">master mute / fader</text><path d="M 1010 470 L 1230 470 L 1230 386" fill="none" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><text x="1120" y="458.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2e8b57">YES</text><rect x="1030" y="130" width="440" height="250" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="1250.0" y="201.1" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16150f">Output side</text><text x="1250.0" y="248.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Output patch (main → correct output)</text><text x="1250.0" y="272.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Cable desk/stagebox → speaker/amp</text><text x="1250.0" y="296.3" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Speaker / amp on? Power? LEDs?</text><text x="1250.0" y="320.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Volume knob on the speaker</text><text x="1250.0" y="343.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16150f">Protect/clip LED on the amp</text><text x="1230" y="700.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#6b6a62">Tip: use headphones + PFL/solo</text><text x="1230" y="726.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#6b6a62">to listen to any channel directly.</text></svg>
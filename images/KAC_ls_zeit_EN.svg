<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="550" viewBox="0 0 1500 550"><defs><marker id="ah" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6a62"/></marker><marker id="ahr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e02718"/></marker></defs><rect x="0" y="0" width="1500" height="550" fill="#f2f1ec"/><text x="750" y="44.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16150f">How long is it safe? (per day, without hearing protection)</text><text x="200" y="128.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">85 dB(A)</text><rect x="230" y="100" width="1050.0" height="42" rx="4" ry="4" fill="#2e8b57" stroke="#2e8b57" stroke-width="0"/><text x="1294.0" y="130.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">8 h</text><text x="200" y="190.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">88 dB(A)</text><rect x="230" y="162" width="525.0" height="42" rx="4" ry="4" fill="#e0a800" stroke="#e0a800" stroke-width="0"/><text x="769.0" y="192.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">4 h</text><text x="200" y="252.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">91 dB(A)</text><rect x="230" y="224" width="262.5" height="42" rx="4" ry="4" fill="#e0a800" stroke="#e0a800" stroke-width="0"/><text x="506.5" y="254.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">2 h</text><text x="200" y="314.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">94 dB(A)</text><rect x="230" y="286" width="131.25" height="42" rx="4" ry="4" fill="#e86a10" stroke="#e86a10" stroke-width="0"/><text x="375.25" y="316.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">1 h</text><text x="200" y="376.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">97 dB(A)</text><rect x="230" y="348" width="65.625" height="42" rx="4" ry="4" fill="#e86a10" stroke="#e86a10" stroke-width="0"/><text x="309.625" y="378.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">30 min</text><text x="200" y="438.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">100 dB(A)</text><rect x="230" y="410" width="32.8125" height="42" rx="4" ry="4" fill="#e02718" stroke="#e02718" stroke-width="0"/><text x="276.8125" y="440.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">15 min</text><text x="750" y="520.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#e02718">Rule of thumb: every +3 dB halves the safe time (NIOSH guideline).</text></svg>
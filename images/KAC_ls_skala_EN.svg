" fill="#e02718">exposure = risk</text><line x1="1035.0" y1="381" x2="1035.0" y2="405" stroke="#6b6a62" stroke-width="2"/><text x="1035.0" y="431.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e02718">limit for</text><text x="1035.0" y="453.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e02718">concerts (DE)</text><line x1="1200.0" y1="381" x2="1200.0" y2="405" stroke="#6b6a62" stroke-width="2"/><text x="1200.0" y="431.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6a62">rock concert</text><text x="1200.0" y="453.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6a62">front row</text><line x1="1350.0" y1="381" x2="1350.0" y2="405" stroke="#6b6a62" stroke-width="2"/><text x="1350.0" y="431.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6a62">pain</text><text x="1350.0" y="453.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6a62">threshold</text><text x="750" y="545.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">+3 dB = double the sound energy · +10 dB ≈ perceived as twice as loud</text></svg>
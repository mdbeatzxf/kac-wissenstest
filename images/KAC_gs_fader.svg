<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600"><defs><marker id="ah" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6a62"/></marker><marker id="ahr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e02718"/></marker></defs><rect x="0" y="0" width="1500" height="600" fill="#f2f1ec"/><text x="750" y="44.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16150f">Der Fader: 0 dB (Unity) = Signal unverändert</text><rect x="280" y="140.0" width="260" height="196.0" rx="10" ry="10" fill="#dcebe2" stroke="#2e8b57" stroke-width="2"/><text x="410" y="259.6" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2e8b57">Arbeits-</text><text x="410" y="285.6" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2e8b57">bereich</text><rect x="323" y="100" width="14" height="460" rx="7" ry="7" fill="#d8d6cc" stroke="#16150f" stroke-width="1.5"/><line x1="270" y1="100.0" x2="312" y2="100.0" stroke="#16150f" stroke-width="2"/><line x1="348" y1="100.0" x2="390" y2="100.0" stroke="#16150f" stroke-width="2"/><text x="255" y="108.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">+10</text><line x1="270" y1="146.0" x2="312" y2="146.0" stroke="#16150f" stroke-width="2"/><line x1="348" y1="146.0" x2="390" y2="146.0" stroke="#16150f" stroke-width="2"/><text x="255" y="154.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">+5</text><line x1="270" y1="215.0" x2="312" y2="215.0" stroke="#16150f" stroke-width="4"/><line x1="348" y1="215.0" x2="390" y2="215.0" stroke="#16150f" stroke-width="4"/><text x="255" y="223.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#e02718">0</text><line x1="270" y1="274.8" x2="312" y2="274.8" stroke="#16150f" stroke-width="2"/><line x1="348" y1="274.8" x2="390" y2="274.8" stroke="#16150f" stroke-width="2"/><text x="255" y="282.8" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">−5</text><line x1="270" y1="330.0" x2="312" y2="330.0" stroke="#16150f" stroke-width="2"/><line x1="348" y1="330.0" x2="390" y2="330.0" stroke="#16150f" stroke-width="2"/><text x="255" y="338.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">−10</text><line x1="270" y1="403.6" x2="312" y2="403.6" stroke="#16150f" stroke-width="2"/><line x1="348" y1="403.6" x2="390" y2="403.6" stroke="#16150f" stroke-width="2"/><text x="255" y="411.6" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">−20</text><line x1="270" y1="454.2" x2="312" y2="454.2" stroke="#16150f" stroke-width="2"/><line x1="348" y1="454.2" x2="390" y2="454.2" stroke="#16150f" stroke-width="2"/><text x="255" y="462.2" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">−30</text><line x1="270" y1="491.0" x2="312" y2="491.0" stroke="#16150f" stroke-width="2"/><line x1="348" y1="491.0" x2="390" y2="491.0" stroke="#16150f" stroke-width="2"/><text x="255" y="499.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">−40</text><line x1="270" y1="560.0" x2="312" y2="560.0" stroke="#16150f" stroke-width="2"/><line x1="348" y1="560.0" x2="390" y2="560.0" stroke="#16150f" stroke-width="2"/><text x="255" y="568.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">−∞</text><rect x="275" y="193.0" width="110" height="44" rx="6" ry="6" fill="#16150f" stroke="#16150f" stroke-width="2"/><line x1="280" y1="215.0" x2="380" y2="215.0" stroke="#f2f1ec" stroke-width="3"/><text x="640" y="130.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16150f">0 dB = Unity</text><text x="640" y="162.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16150f">Der Fader lässt das Signal genau so durch, wie es reinkommt.</text><text x="640" y="185.8" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16150f">Um 0 dB herum ist die Auflösung am feinsten.</text><text x="640" y="250.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e02718">Fader ganz oben (+10) und trotzdem zu leise?</text><text x="640" y="282.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16150f">→ Gain zu niedrig. Gain hoch, Fader zurück Richtung 0.</text><text x="640" y="346.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e02718">Fader ganz unten (−30 und tiefer) und trotzdem zu laut?</text><text x="640" y="378.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16150f">→ Gain zu hoch. Gain runter, Fader wieder Richtung 0.</text><text x="640" y="442.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16150f">Master</text><text x="640" y="474.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16150f">Gleiche Regel: Master um 0 dB. Muss er weit runter,</text><text x="640" y="497.8" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16150f">sind PA-Regler oder Gains zu hoch eingestellt.</text></svg>
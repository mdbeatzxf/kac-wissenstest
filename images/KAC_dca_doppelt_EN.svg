<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520"><defs><marker id="ah" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6a62"/></marker><marker id="ahr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e02718"/></marker></defs><rect x="0" y="0" width="1500" height="520" fill="#f2f1ec"/><line x1="750" y1="30" x2="750" y2="490" stroke="#d0cec4" stroke-width="2"/><text x="375" y="50.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#e02718">Wrong: routed twice</text><text x="1125" y="50.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#2e8b57">Right: only via the group</text><rect x="40" y="200" width="170" height="90" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="125.0" y="252.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">Channel</text><rect x="300" y="90" width="170" height="90" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="385.0" y="128.6" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">Group</text><text x="385.0" y="173.4" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e02718">EQ · Comp</text><rect x="540" y="200" width="170" height="90" rx="12" ry="12" fill="#16150f" stroke="#16150f" stroke-width="2"/><text x="625.0" y="252.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#f2f1ec">Master</text><path d="M 212 230 L 296 150" fill="none" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><path d="M 472 135 L 536 225" fill="none" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><path d="M 212 260 L 536 260" fill="none" stroke="#e02718" stroke-width="3.5" marker-end="url(#ahr)"/><text x="375" y="300.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e02718">channel → master direct</text><text x="375" y="380.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">The signal arrives twice:</text><text x="375" y="412.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#16150f">louder than expected, colouration,</text><text x="375" y="440.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#16150f">the group fader doesn't control it properly.</text><rect x="790" y="200" width="170" height="90" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="875.0" y="252.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">Channel</text><rect x="1050" y="90" width="170" height="90" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="1135.0" y="128.6" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">Group</text><text x="1135.0" y="173.4" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e02718">EQ · Comp</text><rect x="1290" y="200" width="170" height="90" rx="12" ry="12" fill="#16150f" stroke="#16150f" stroke-width="2"/><text x="1375.0" y="252.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#f2f1ec">Master</text><path d="M 962 230 L 1046 150" fill="none" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><path d="M 1222 135 L 1286 225" fill="none" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><path d="M 962 260 L 1286 260" fill="none" stroke="#c9c7bd" stroke-width="3" stroke-dasharray="8,8"/><text x="1125" y="300.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e8b57">channel → master: OFF</text><text x="1125" y="380.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Route the channel only to the group,</text><text x="1125" y="412.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#16150f">the group goes to the master.</text><text x="1125" y="440.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#16150f">One path — one fader controls it all.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640"><defs><marker id="ah" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6a62"/></marker><marker id="ahr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e02718"/></marker></defs><rect x="0" y="0" width="1500" height="640" fill="#f2f1ec"/><text x="750" y="44.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16150f">Reading a patch grid: dot = connected</text><text x="630.0" y="108.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#6b6a62">SOURCES →</text><text x="60" y="186.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#6b6a62">DESTINATIONS ↓</text><rect x="330" y="200" width="600" height="290" rx="6" ry="6" fill="#faf9f5" stroke="#16150f" stroke-width="2"/><text x="390.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">Stagebox</text><text x="390.0" y="177.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">1</text><line x1="450" y1="200" x2="450" y2="490" stroke="#d0cec4" stroke-width="1.5"/><text x="510.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">Stagebox</text><text x="510.0" y="177.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">2</text><line x1="570" y1="200" x2="570" y2="490" stroke="#d0cec4" stroke-width="1.5"/><text x="630.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">Local</text><text x="630.0" y="177.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">1</text><line x1="690" y1="200" x2="690" y2="490" stroke="#d0cec4" stroke-width="1.5"/><text x="750.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">USB</text><text x="750.0" y="177.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">1</text><line x1="810" y1="200" x2="810" y2="490" stroke="#d0cec4" stroke-width="1.5"/><text x="870.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">Dante</text><text x="870.0" y="177.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">1</text><text x="316" y="236.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Ch 1 · kick</text><line x1="330" y1="258" x2="930" y2="258" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="294.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Ch 2 · snare</text><line x1="330" y1="316" x2="930" y2="316" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="352.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Ch 3 · pastor</text><line x1="330" y1="374" x2="930" y2="374" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="410.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Ch 4 · playback</text><line x1="330" y1="432" x2="930" y2="432" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="468.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">Ch 5 · kick (stream)</text><circle cx="390.0" cy="229.0" r="13" fill="#16150f" stroke="#16150f" stroke-width="2"/><circle cx="510.0" cy="287.0" r="13" fill="#16150f" stroke="#16150f" stroke-width="2"/><circle cx="630.0" cy="345.0" r="13" fill="#16150f" stroke="#16150f" stroke-width="2"/><circle cx="750.0" cy="403.0" r="13" fill="#16150f" stroke="#16150f" stroke-width="2"/><circle cx="390.0" cy="461.0" r="13" fill="#e02718" stroke="#e02718" stroke-width="2"/><text x="1000" y="175.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Dot = connected</text><text x="1000" y="203.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">The column's source feeds the row's destination.</text><text x="1000" y="263.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Only ONE dot per destination</text><text x="1000" y="291.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">A channel can only have one source.</text><text x="1000" y="351.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#e02718">One source — several destinations</text><text x="1000" y="379.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">Stagebox 1 feeds channel 1 AND channel 5</text><text x="1000" y="400.2" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">(e.g. a separate kick channel for the stream).</text><text x="1000" y="461.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Empty column</text><text x="1000" y="489.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6b6a62">Dante 1 isn't connected anywhere — it doesn't arrive.</text><text x="750" y="600.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6a62">Which axis is source and which is destination differs by device — always read the labels first.</text></svg>
iddle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#16150f">Full</text><text x="1077.5" y="253.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#16150f">Band</text><text x="1077.5" y="300.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6b6a62">alle + Gesang</text><text x="1077.5" y="320.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6b6a62">Saal-Mix</text><circle cx="1241.25" cy="150" r="34" fill="#16150f" stroke="#16150f" stroke-width="2"/><text x="1241.25" y="161.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#faf9f5">8</text><text x="1241.25" y="228.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#16150f">Sprache</text><text x="1241.25" y="300.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6b6a62">Pastor · Gebet</text><text x="1241.25" y="320.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6b6a62">Übersetzung</text><circle cx="1405.0" cy="150" r="34" fill="#e02718" stroke="#e02718" stroke-width="2"/><text x="1405.0" y="161.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#faf9f5">9</text><text x="1405.0" y="228.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#16150f">Speichern</text><text x="1405.0" y="300.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6b6a62">Szene sichern</text><text x="1405.0" y="320.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6b6a62">bereit sein</text><text x="750" y="395.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#e02718">Erst prüfen, ob alles ankommt — dann von einzeln zu zusammen aufbauen — dann sichern.</text></svg>
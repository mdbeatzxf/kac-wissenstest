<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640"><defs><marker id="ah" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6a62"/></marker><marker id="ahr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e02718"/></marker></defs><rect x="0" y="0" width="1500" height="640" fill="#f2f1ec"/><text x="750" y="44.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16150f">Recording: the tap point decides what you record</text><rect x="30" y="120" width="230" height="100" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="145.0" y="164.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16150f">Input</text><text x="145.0" y="206.3" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b6a62">preamp + gain</text><rect x="360" y="120" width="250" height="100" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="485.0" y="177.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16150f">Gate · Comp · EQ</text><rect x="700" y="120" width="160" height="100" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="780.0" y="177.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16150f">Fader</text><rect x="990" y="120" width="200" height="100" rx="12" ry="12" fill="#16150f" stroke="#16150f" stroke-width="2"/><text x="1090.0" y="177.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#f2f1ec">Main LR</text><rect x="1290" y="120" width="180" height="100" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="1380.0" y="177.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#16150f">PA</text><line x1="262" y1="170.0" x2="356" y2="170.0" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><line x1="612" y1="170.0" x2="696" y2="170.0" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><line x1="862" y1="170.0" x2="986" y2="170.0" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><line x1="1192" y1="170.0" x2="1286" y2="170.0" stroke="#6b6a62" stroke-width="3" marker-end="url(#ah)"/><circle cx="305" cy="170.0" r="10" fill="#e02718" stroke="#e02718" stroke-width="2"/><path d="M 305 181.0 L 305 316" fill="none" stroke="#e02718" stroke-width="3" marker-end="url(#ahr)"/><rect x="170" y="320" width="280" height="120" rx="12" ry="12" fill="#f2f1ec" stroke="#e02718" stroke-width="3"/><text x="310.0" y="363.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Multitrack per channel</text><text x="310.0" y="403.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b6a62">post-gain, “dry”</text><text x="310.0" y="423.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b6a62">USB · card · Dante</text><circle cx="925" cy="170.0" r="10" fill="#16150f" stroke="#16150f" stroke-width="2"/><path d="M 925 181.0 L 925 316" fill="none" stroke="#16150f" stroke-width="3" marker-end="url(#ah)"/><rect x="650" y="320" width="280" height="120" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="790.0" y="363.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Stream mix</text><text x="790.0" y="403.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b6a62">own bus / matrix</text><text x="790.0" y="423.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b6a62">(post-fader)</text><circle cx="1240" cy="170.0" r="10" fill="#16150f" stroke="#16150f" stroke-width="2"/><path d="M 1240 181.0 L 1240 316" fill="none" stroke="#16150f" stroke-width="3" marker-end="url(#ah)"/><rect x="1060" y="320" width="280" height="120" rx="12" ry="12" fill="#f2f1ec" stroke="#16150f" stroke-width="2"/><text x="1200.0" y="363.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16150f">Stereo recording</text><text x="1200.0" y="403.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b6a62">main LR → USB stick</text><text x="1200.0" y="423.8" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b6a62">= exactly the room mix</text><path d="M 310 442 L 310 520 L 100 520 L 100 226" fill="none" stroke="#e02718" stroke-width="3" marker-end="url(#ahr)" stroke-dasharray="9,7"/><text x="330" y="512.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e02718">Virtual soundcheck: play the recording back and pick it as the channel source —</text><text x="330" y="540.0" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#e02718">set gain, EQ and mix without the band.</text><text x="750" y="605.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6a62">The room mix often sounds wrong on a stream (stage and room are missing) — hence a separate stream mix.</text></svg>
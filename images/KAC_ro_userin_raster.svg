mily="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">AES50 A</text><text x="630.0" y="167.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">17</text><line x1="690" y1="190" x2="690" y2="480" stroke="#d0cec4" stroke-width="1.5"/><text x="750.0" y="146.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">AES50 B</text><text x="750.0" y="167.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">5</text><line x1="810" y1="190" x2="810" y2="480" stroke="#d0cec4" stroke-width="1.5"/><text x="870.0" y="146.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">Card</text><text x="870.0" y="167.2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16150f">12</text><text x="316" y="226.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">User In 1 · Kick</text><line x1="330" y1="248" x2="930" y2="248" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="284.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">User In 2 · Snare</text><line x1="330" y1="306" x2="930" y2="306" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="342.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16150f">User In 3 · Bass DI</text><line x1="330" y1="364" x2="930" y2="364" stroke="#d0cec4" stroke-width="1.5"/><text x="316" y="400.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="